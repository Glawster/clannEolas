schemaVersion: 1
id: AREA-000
name: Replace with feature name
summary: >-
  Describe the user outcome in one or two sentences without implying that it
  already exists.
status: proposed
priority: medium
owners:
  - project maintainers
createdDate: YYYY-MM-DD
reviewedDate: null
completedDate: null

userNeeds:
  - As a type of user, I need an outcome so that I receive a benefit.

personas:
  - id: PER-000
    path: docs/personas/example.md
    relevance: Explain how this feature helps the persona in their situation.

scope:
  included:
    - Describe an included outcome.
  excluded:
    - Describe a boundary or deferral.

requirements:
  functional:
    - id: AREA-000-FR-01
      statement: The feature must provide a testable outcome.
  content:
    - id: AREA-000-CR-01
      statement: Content must use clear, accessible language.
  privacyAndSecurity:
    - id: AREA-000-PS-01
      statement: The feature must not require secrets in ordinary handbook content.

acceptanceCriteria:
  - id: AREA-000-AC-01
    statement: A reviewer can verify the intended outcome.
    verificationMethod: review

dependencies:
  requires: []
  enables: []
  related: []

principles:
  - P-001

risks:
  - id: AREA-000-R-01
    description: Describe a feature-specific risk.
    mitigation: Describe how the risk will be reduced.

unresolvedQuestions:
  - id: AREA-000-Q-01
    question: Record a question or use an empty list when none remain.
    owner: project maintainers

implementationNotes:
  - Record constraints or likely implementation considerations, not completed work.

traceability:
  projectRequirements:
    - project/project.yaml
  documentation: []
  code: []
  tests: []
  adrs: []
  supersedes: []
  supersededBy: []

verification:
  status: notStarted
  evidence: []
