schemaVersion: 1
id: HB-006
name: Getting Started guide
summary: >-
  Turn the opening handbook chapter into practical guidance that helps a person
  understand, begin, share, protect and maintain their handbook safely.
status: proposed
priority: high
owners: [project maintainers]
createdDate: 2026-07-22
reviewedDate: null
completedDate: null

userNeeds:
  - As a handbook owner, I need clear first steps so that I can begin without having to understand the whole handbook at once.
  - As a trusted helper, I need to understand my role and the handbook's limits before I rely on or contribute to it.

personas:
  - id: PER-001
    path: docs/personas/sarah.md
    relevance: Sarah needs to understand the handbook quickly and find reliable next steps during bereavement.
  - id: PER-002
    path: docs/personas/david.md
    relevance: David needs a manageable way to prepare, review and share the handbook with his daughter.
  - id: PER-004
    path: docs/personas/morgan.md
    relevance: Morgan needs explicit privacy boundaries and safe guidance before recording household information.

scope:
  included:
    - Why the handbook exists and the situations in which it may help
    - A short, manageable process for starting and completing it over time
    - Annual and significant-change review expectations
    - Guidance on who should know that the handbook exists
    - Paper and digital storage, access, backup and disposal considerations
    - Ways to prepare or review it with a partner, executor, attorney or other trusted person
    - Clear warnings about information that must not be stored in ordinary handbook content
    - The distinction between the public project and a private completed household handbook
  excluded:
    - Legal, medical, financial or information-security advice tailored to an individual
    - Choosing a specific storage product, password manager or cloud provider
    - Collecting detailed household information within the Getting Started chapter
    - Assuming that a partner, executor, attorney or next of kin has authority beyond their actual role
    - A web or desktop onboarding flow

requirements:
  functional:
    - id: HB-006-FR-01
      statement: The guide must explain why the handbook exists and the practical problems it is intended to reduce.
    - id: HB-006-FR-02
      statement: The guide must provide a short sequence for starting with urgent or high-value information and completing other sections over time.
    - id: HB-006-FR-03
      statement: The guide must explain that the handbook should be reviewed at least annually and after significant household changes.
    - id: HB-006-FR-04
      statement: The guide must help the owner decide which trusted people should know that the handbook exists, where authorised access instructions are kept and when they should use it.
    - id: HB-006-FR-05
      statement: The guide must explain how an owner and trusted person can prepare or review the handbook together without assuming that relationship creates legal authority.
    - id: HB-006-FR-06
      statement: The guide must remain usable in human-readable digital form and on paper without an application or internet connection.

  content:
    - id: HB-006-CR-01
      statement: The guide must explain the handbook's purpose, audience, limitations and relationship to professional advice in plain language.
    - id: HB-006-CR-02
      statement: The guide must link specialised role terms such as executor and attorney to the glossary.
    - id: HB-006-CR-03
      statement: The guide must explain that a completed handbook is private household data while repository templates and fictional examples are public resources.
    - id: HB-006-CR-04
      statement: The guide must use short steps, headings and checklists suitable for a reader under stress or with limited time.
    - id: HB-006-CR-05
      statement: The guide must state that incomplete and not-applicable sections are acceptable and should identify follow-up actions rather than encourage invented answers.

  privacyAndSecurity:
    - id: HB-006-PS-01
      statement: The guide must state prominently that passwords, PINs, recovery codes and equivalent Highly Confidential values must not be stored in ordinary handbook content.
    - id: HB-006-PS-02
      statement: The guide must explain when to record a safe reference to a protected document or access arrangement instead of copying sensitive information.
    - id: HB-006-PS-03
      statement: The guide must discuss proportionate storage, controlled sharing, backup and secure disposal for paper and digital copies without promising that any method is risk-free.
    - id: HB-006-PS-04
      statement: The guide itself must be classified Public while clearly identifying the expected classifications of private household entries it discusses.

acceptanceCriteria:
  - id: HB-006-AC-01
    statement: A first-time reader can explain why the handbook exists, what it can and cannot do and which section they will complete first.
    verificationMethod: task-based content review
  - id: HB-006-AC-02
    statement: The guide contains explicit guidance for annual review and review after significant changes, with a link to the annual review process.
    verificationMethod: content and link review
  - id: HB-006-AC-03
    statement: The guide explains who may need to know about the handbook and distinguishes awareness, trusted access and formal legal authority.
    verificationMethod: role and glossary review
  - id: HB-006-AC-04
    statement: Paper and digital storage, sharing, backup and disposal considerations are present and consistent with the privacy model.
    verificationMethod: privacy and security review
  - id: HB-006-AC-05
    statement: A prominent do-not-store list includes passwords, PINs, recovery codes, full payment-card security details and private cryptographic keys.
    verificationMethod: prohibited-information review
  - id: HB-006-AC-06
    statement: Sarah, David and Morgan can each complete a scenario walkthrough using only the guide, handbook outline and referenced project guidance.
    verificationMethod: persona walkthrough
  - id: HB-006-AC-07
    statement: The guide is understandable and navigable in source Markdown and a representative printed form.
    verificationMethod: accessibility and print review

dependencies:
  requires: [HB-001, HB-002, HB-003]
  enables: []
  related: [HB-005]

principles: [P-001, P-002, P-003, P-004, P-005, P-006, P-007, P-008, P-010]

risks:
  - id: HB-006-R-01
    description: Too much introductory guidance may prevent readers from starting.
    mitigation: Lead with a short path and move supporting detail behind clear headings and links.
  - id: HB-006-R-02
    description: Collaboration guidance may imply that a family relationship grants access or legal decision-making authority.
    mitigation: Distinguish practical help, trusted access and formal roles, with glossary links and professional-advice boundaries.
  - id: HB-006-R-03
    description: General security guidance may be mistaken for a guarantee that a chosen storage method is safe.
    mitigation: Explain trade-offs, avoid endorsements and state that owners must choose controls appropriate to their circumstances.

unresolvedQuestions:
  - id: HB-006-Q-01
    question: Which three to five tasks form the shortest useful first-session checklist?
    owner: project maintainers
  - id: HB-006-Q-02
    question: Which significant changes should be named in the Getting Started guide versus left to the annual review chapter?
    owner: project maintainers
  - id: HB-006-Q-03
    question: What representative print check should be required before the guide can be approved?
    owner: project maintainers

implementationNotes:
  - Expand handbook/01-GettingStarted.md incrementally rather than replacing useful content without review.
  - Use links or cross-references for detailed privacy, glossary and review guidance instead of duplicating it.
  - Treat Getting Started as a projection of the shared domain model, not as a separate data model or application onboarding flow.

