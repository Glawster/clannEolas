schemaVersion: 1
id: FH-002
name: Privacy and security model
summary: Define safe information-handling rules for public guidance and private household copies.
status: proposed
priority: critical
owners: [project maintainers]
createdDate: 2026-07-22
reviewedDate: null
completedDate: null
userNeeds:
  - As a handbook owner, I need to understand what to record and what only to reference so that I do not create avoidable harm.
  - As a trusted reader, I need access guidance that does not disclose reusable credentials.
scope:
  included:
    - Data classification, minimisation, safe references, access, storage, sharing, backup and disposal guidance
    - Separation of reusable public material from private household data
  excluded:
    - Guaranteeing the security of a user's chosen storage method
    - Storing or managing credentials
requirements:
  functional:
    - id: FH-002-FR-01
      statement: Each handbook section must indicate whether requested information is public guidance, private data, sensitive data or a secret that must not be recorded.
    - id: FH-002-FR-02
      statement: Guidance must explain risks and practical safeguards for paper and digital copies.
  content:
    - id: FH-002-CR-01
      statement: Guidance must give safe patterns for referencing documents and credential stores by location.
    - id: FH-002-CR-02
      statement: Examples must be explicitly fictional and contain no usable credentials or realistic identifiers.
  privacyAndSecurity:
    - id: FH-002-PS-01
      statement: Ordinary handbook content must never request passwords, PINs or recovery codes.
    - id: FH-002-PS-02
      statement: The project must collect only information needed for a stated household outcome.
    - id: FH-002-PS-03
      statement: Public repository content and private household data must have an explicit boundary.
acceptanceCriteria:
  - id: FH-002-AC-01
    statement: A section author can classify every proposed field using the documented model.
    verificationMethod: classification exercise
  - id: FH-002-AC-02
    statement: A repository scan finds no real household data, passwords, PINs or recovery codes in examples.
    verificationMethod: manual and automated content review
  - id: FH-002-AC-03
    statement: Paper and digital storage, controlled sharing, backup and secure disposal are covered without mandating a vendor.
    verificationMethod: content review
dependencies:
  requires: []
  enables: [FH-001, FH-003, FH-004, FH-005]
  related: []
principles: [privacyFirst, noOrdinarySecretStorage, referenceSensitiveInformation, noVendorLockIn, publicPrivateSeparation]
risks:
  - id: FH-002-R-01
    description: Safety warnings may be too vague to change user behaviour.
    mitigation: Put concise warnings next to risky fields and include safer alternatives.
  - id: FH-002-R-02
    description: Location references may reveal enough detail to assist unauthorised access.
    mitigation: Describe locations only as precisely as trusted readers need and explain that trade-off.
unresolvedQuestions:
  - id: FH-002-Q-01
    question: What minimum data-classification vocabulary will be clearest to non-technical readers?
    owner: project maintainers
  - id: FH-002-Q-02
    question: Should private household copies live outside the repository by default, or in an ignored directory with prominent warnings?
    owner: project maintainers
implementationNotes:
  - The existing empty docs/privacyAndSecurity.md is the intended documentation target.
traceability:
  projectRequirements: [requirements/project.yaml]
  documentation: [docs/privacyAndSecurity.md, handbook/08-DigitalLife.md]
  code: []
  tests: []
  decisions: []
  supersedes: []
  supersededBy: []
verification:
  status: notStarted
  evidence: []
